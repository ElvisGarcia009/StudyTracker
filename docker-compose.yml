# StudyTracker: levanta todo con
#   docker compose up -d --build
# y abre http://localhost:3000
#
# Todas las variables tienen un valor por defecto, así que funciona sin .env.
# Para personalizarlas, copia .env.example a .env y edítalo.

services:
  mongo:
    image: mongo:7
    container_name: studytracker-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-studytracker}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-studytracker}
    volumes:
      - mongo-data:/data/db
    # Solo accesible desde tu máquina (útil para MongoDB Compass)
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: studytracker-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-studytracker}:${MONGO_PASSWORD:-studytracker}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-studytracker}
      TZ: ${TZ:-America/Santo_Domingo}
    # Expuesto para ver la API en Swagger: http://localhost:8081/q/swagger-ui
    ports:
      - "${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: studytracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  mongo-data:
