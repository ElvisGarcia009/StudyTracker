# ---------- HTTP ----------
quarkus.http.port=8080
# Todos los endpoints REST quedan bajo /api (Swagger y health siguen en /q/...)
quarkus.rest.path=/api

# ---------- MongoDB ----------
# En Docker la cadena llega por la variable MONGO_URI (ver docker-compose.yml).
# Para desarrollo local apunta al Mongo del docker-compose expuesto en localhost.
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://studytracker:studytracker@localhost:27018/?authSource=admin}
quarkus.mongodb.database=${MONGO_DATABASE:studytracker}
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.health.enabled=true

# ---------- Zona horaria ----------
# Define en qué zona se calculan los "días" (hoy, rachas, mapa de calor).
studytracker.timezone=${TZ:America/Santo_Domingo}

# ---------- OpenAPI / Swagger ----------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=StudyTracker API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API del StudyTracker: materias, plan semanal, timer, metas, logros y estadísticas.

# ---------- CORS (solo para desarrollo con `npm run dev`) ----------
# En Docker, nginx sirve el frontend y el backend en el mismo origen, así que no hace falta.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# ---------- Logs ----------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
