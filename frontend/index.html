<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a26" />
    <meta name="description" content="StudyTracker: planifica, cronometra y mide tu tiempo de estudio." />
    <title>StudyTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      // Sin preferencia guardada, la biblioteca abre de noche.
      var theme = 'dark'
      try {
        theme = localStorage.getItem('st-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {}
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
